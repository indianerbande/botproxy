[project]
name = "botproxy"
version = "0.1.0"
description = "Lokaler Proxy fuer Clients mit statischem API-Key gegen Endpunkte mit kurzlebigen OAuth-Token"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    # TLS gegen den Zertifikatsspeicher des Systems statt gegen certifi: hinter
    # einem TLS-inspizierenden Proxy scheitert sonst jede Weiterleitung.
    "truststore>=0.10",
]

[project.scripts]
botproxy = "botproxy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["botproxy"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
